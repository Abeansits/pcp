# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: PCP
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PCPCore:
    path: Core

targets:
  PCP:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PCPCore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: PCP
        PRODUCT_BUNDLE_IDENTIFIER: $(PCP_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/PCP.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
      configs:
        Debug:
          PCP_APS_ENVIRONMENT: development
        Release:
          PCP_APS_ENVIRONMENT: production
    scheme: {}
