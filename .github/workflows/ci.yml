name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: cd Core && swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (unsigned)
        # CloudKit entitlements need a provisioning profile, so this build
        # leaves them out. iCloud stays off.
        run: |
          xcodebuild -project PEA.xcodeproj -scheme PEA -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= build
      - name: Install like a person does
        # make install: Release build, signed with a self-made "PEA Local"
        # identity, copied into a scratch folder. OPEN=0 skips the launch.
        run: make install PREFIX="$RUNNER_TEMP/Applications" OPEN=0
